<div class="player" *ngIf="currentSong">
  <div class="player-info">
    <img [src]="currentSong?.imagen || 'assets/default-cover.jpg'" [alt]="currentSong?.titulo" class="player-cover"/>
    <div class="player-text">
      <span class="player-title">{{ currentSong?.titulo || 'Sin título' }}</span>
      <a class="player-artist" (click)="goToArtist()" *ngIf="currentSong?.cantante">{{ currentSong.cantante.cantante }}</a>
    </div>
  </div>

  <div class="player-controls">
    <div class="player-buttons">
      <button class="ctrl-btn" [class.active]="shuffleOn" (click)="toggleShuffle()" title="Aleatorio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6"/></svg>
      </button>
      <button class="ctrl-btn" (click)="prevSong()" title="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" (click)="togglePlay()">
        <svg *ngIf="!isPlaying" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
        <svg *ngIf="isPlaying" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" (click)="nextSong()" title="Siguiente">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" [class.active]="repeatOn" (click)="toggleRepeat()" title="Repetir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span class="progress-time">{{ formatTime(currentTime) }}</span>
      <div class="progress-bar" (click)="seekClick($event)">
        <div class="progress-fill" [style.width.%]="progress"></div>
      </div>
      <span class="progress-time">{{ formatTime(duration) }}</span>
    </div>
  </div>

  <div class="player-extra">
    <div class="volume-row">
      <button class="ctrl-btn" (click)="toggleMute()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path *ngIf="volume > 0" d="M15.54 8.46a5 5 0 010 7.07"/>
          <line *ngIf="volume === 0" x1="23" y1="9" x2="17" y2="15"/><line *ngIf="volume === 0" x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <div class="volume-bar" (click)="seekVolume($event)">
        <div class="volume-fill" [style.width.%]="volume * 100"></div>
      </div>
    </div>
  </div>
</div>
