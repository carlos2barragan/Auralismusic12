<div class="edge-trigger" *ngIf="!isOpen" (mouseenter)="open()"></div>
<div class="sidebar-overlay" [class.open]="isOpen" (click)="close()"></div>

<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <a routerLink="/home" (click)="close()">
      <img [src]="logoUrl" alt="Auralis" class="sidebar-logo"/>
    </a>
    <button class="sidebar-close" (click)="close()" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/home" class="sidebar-link active" (click)="close()">
      <span class="nav-icon">🏠</span> Inicio
    </a>
    <a routerLink="/playlist" class="sidebar-link" (click)="close()">
      <span class="nav-icon">📁</span> Playlists
    </a>
    <a routerLink="/profile" class="sidebar-link" (click)="close()">
      <span class="nav-icon">👤</span> Perfil
    </a>
  </nav>

  <div class="sidebar-divider"></div>
  <div class="sidebar-section-title">Géneros</div>

  <div class="genre-list" *ngIf="genres.length > 0">
    <a class="genre-item" *ngFor="let g of genres" (click)="goToGenre(g)">
      <span class="genre-color" [style.background]="g.accent"></span>
      {{ g.name }}
      <span class="genre-count">{{ g.count }}</span>
    </a>
  </div>

  <div class="genre-list" *ngIf="genres.length === 0">
    <div class="genre-skeleton" *ngFor="let i of [1,2,3,4,5,6]">
      <div class="genre-skel-color"></div>
      <div class="genre-skel-text"></div>
    </div>
  </div>

  <div class="sidebar-divider" *ngIf="isAdmin"></div>
  <nav class="sidebar-nav" *ngIf="isAdmin">
    <a routerLink="/admin/solicitudes" class="sidebar-link" (click)="close()">
      <span class="nav-icon">⚙️</span> Solicitudes
    </a>
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/profile" class="premium-banner" (click)="close(); $event.preventDefault();">
      <span>⭐ Hazte Premium</span>
    </a>
  </div>
</aside>
